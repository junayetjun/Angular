<!-- parent-registration.html -->

<form [formGroup]="userForm" (ngSubmit)="registerParent()" class="container mt-5 p-4 border rounded shadow-sm bg-white" style="max-width: 600px;">

  <h2 class="mb-4 text-center text-primary">Parent Registration</h2>

  <!-- User Details -->
  <fieldset class="mb-4">
    <!-- <legend class="h5 mb-3">User Details</legend> -->

    <div class="mb-3">
      <label for="name" class="form-label">Parent Name</label>
      <input id="name" type="text" class="form-control" formControlName="name" placeholder="Enter full name" />
      <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched" class="text-danger small">
        Name is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input id="email" type="email" class="form-control" formControlName="email" placeholder="example@mail.com" />
      <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="text-danger small">
        Valid email is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input id="phone" type="tel" class="form-control" formControlName="phone" placeholder="+1 234 567 8900" />
      <div *ngIf="userForm.get('phone')?.invalid && userForm.get('phone')?.touched" class="text-danger small">
        Phone is required.
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password" placeholder="Enter password" />
      <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="text-danger small">
        Password is required.
      </div>
    </div>
  </fieldset>

  <!-- Child Details -->
  <fieldset [formGroup]="parentForm" class="mb-4">
    <legend class="h5 mb-3">Child Details</legend>

    <div class="mb-3">
      <label for="childName" class="form-label">Child Name</label>
      <input id="childName" type="text" class="form-control" formControlName="childName" placeholder="Enter child's name" />
      <div *ngIf="parentForm.get('childName')?.invalid && parentForm.get('childName')?.touched" class="text-danger small">
        Child name is required.
      </div>
    </div>
  </fieldset>

  <!-- Photo Upload -->
  <div class="mb-4">
    <label for="photo" class="form-label">Upload Photo</label>
    <input id="photo" type="file" class="form-control" (change)="onFileSelected($event)" />
  </div>

  <!-- Submit Button -->
  <button type="submit" class="btn btn-primary w-100" [disabled]="userForm.invalid || parentForm.invalid || !photoFile">
    Register
  </button>

  <!-- Message -->
  <div *ngIf="message" class="alert mt-3" [ngClass]="{'alert-success': message.includes('success'), 'alert-danger': message.includes('fail') }" role="alert">
    {{ message }}
  </div>
</form>
