<div class="container mt-5 p-4 border rounded shadow-sm bg-white" style="max-width: 600px;">
    <h2 class="mb-4 text-center text-primary">Parent Login</h2>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <!-- Email Field -->
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input id="email" type="email" class="form-control" formControlName="email"
                placeholder="example@mail.com" />
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger small">
                A valid email is required.
            </div>
        </div>

        <!-- Password Field -->
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password"
                placeholder="Enter password" />
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                class="text-danger small">
                Password is required.
            </div>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="isLoading" class="text-center mb-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || isLoading">
            Login
        </button>
    </form>

    <!-- Error Message -->
    <div *ngIf="message" class="alert alert-danger mt-3" role="alert">
        {{ message }}
    </div>
</div>
