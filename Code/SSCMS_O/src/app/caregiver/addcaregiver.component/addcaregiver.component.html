<div class="container mt-5">
  <div class="card p-4 shadow-lg rounded-3 border-0">
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold">Caregiver Registration</h2>
      <p class="text-muted">Please fill all fields to complete registration</p>
    </div>
    
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card h-100 border-0 bg-light rounded-3">
          <div class="card-body">
            <h4 class="card-title text-primary mb-3 pb-2 border-bottom border-primary border-2">
              <i class="bi bi-person-circle me-2"></i>User Information
            </h4>
            <form [formGroup]="userForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input class="form-control form-control-lg" formControlName="name" placeholder="Enter your name" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-lg" formControlName="email" placeholder="Enter email" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Phone Number</label>
                <input class="form-control form-control-lg" formControlName="phone" placeholder="Enter phone" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control form-control-lg" formControlName="password" placeholder="Create password" />
              </div>
            </form>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card h-100 border-0 bg-light rounded-3">
          <div class="card-body">
            <h4 class="card-title text-primary mb-3 pb-2 border-bottom border-primary border-2">
              <i class="bi bi-heart-pulse me-2"></i>Caregiver Information
            </h4>
            <form [formGroup]="caregiverForm" class="mb-4">
              <div class="mb-3">
                <label class="form-label fw-semibold">Gender</label>
                <select class="form-select form-select-lg" formControlName="gender">
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Date of Birth</label>
                <input type="date" class="form-control form-control-lg" formControlName="dateOfBirth" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Skills</label>
                <input class="form-control form-control-lg" formControlName="skill" placeholder="e.g., Nursing, Physiotherapy" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Experience</label>
                <textarea class="form-control form-control-lg" formControlName="experience" rows="3" placeholder="Describe your experience"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Address</label>
                <input type="text" class="form-control form-control-lg" formControlName="address" placeholder="Enter full address" />
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card mt-4 border-0 bg-light rounded-3">
      <div class="card-body">
        <h4 class="card-title text-primary mb-3 pb-2 border-bottom border-primary border-2">
          <i class="bi bi-upload me-2"></i>Profile Photo
        </h4>
        <div class="mb-3">
          <label class="form-label fw-semibold">Upload Photo</label>
          <div class="position-relative">
            <input type="file" (change)="onPhotoSelected($event)" class="form-control form-control-lg" />
            <div class="form-text text-muted">JPG, PNG or GIF (MAX. 5MB)</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="d-grid mt-4">
      <button type="submit" class="btn btn-primary btn-lg py-3 fw-bold" (click)="onSubmit()">
        <i class="bi bi-check-circle me-2"></i>Complete Registration
      </button>
    </div>
    
    <div class="mt-4" *ngIf="message">
      <div class="alert d-flex align-items-center" 
           [ngClass]="{
             'alert-success': message.includes('Success'),
             'alert-danger': !message.includes('Success')
           }">
        <i class="bi me-2" 
           [ngClass]="{
             'bi-check-circle-fill': message.includes('Success'),
             'bi-exclamation-triangle-fill': !message.includes('Success')
           }"></i>
        <div>{{ message }}</div>
      </div>
    </div>
  </div>
</div>

<style>
  .card {
    transition: transform 0.3s ease;
  }
  .card:hover {
    transform: translateY(-5px);
  }
  .form-control, .form-select {
    transition: all 0.3s ease;
  }
  .form-control:focus, .form-select:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
  }
  .btn-primary {
    transition: all 0.3s ease;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
</style>
