<h2>Warehouse Stock Overview</h2>

<table>
    <thead>
        <tr>
            <th>Warehouse</th>
            <th>Material</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let stock of stocks" [ngClass]="{ 'low-stock': isLowStock(stock) }">
            <td>{{ getWarehouseName(stock.warehouseId) }}</td>
            <td>{{ getMaterialName(stock.materialId) }}</td>
            <td>{{ stock.quantity }}</td>
        </tr>
        
    </tbody>
</table>
