<h2>🏢 Warehouses</h2>

<form [formGroup]="warehouseForm" (ngSubmit)="submitForm()">
    <input formControlName="name" placeholder="Warehouse Name" required />
    <input formControlName="location" placeholder="Location" required />
    <input formControlName="capacity" type="number" placeholder="Capacity" required min="1" />
    <button type="submit">{{ isEditMode ? 'Update' : 'Add' }}</button>
    <button type="button" (click)="cancelEdit()" *ngIf="isEditMode">Cancel</button>
</form>

<hr />

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Location</th>
            <th>Capacity</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let warehouse of warehouses">
            <td>{{ warehouse.name }}</td>
            <td>{{ warehouse.location }}</td>
            <td>{{ warehouse.capacity }}</td>
            <td>
                <button (click)="editWarehouse(warehouse)">✏️ Edit</button>
                <button (click)="deleteWarehouse(warehouse.id!)">🗑️ Delete</button>
            </td>
        </tr>
    </tbody>
</table>
