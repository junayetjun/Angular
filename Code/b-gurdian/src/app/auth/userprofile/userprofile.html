

<div class="userprofile">

    <div class="container">
    <div class="profile-section" *ngIf="user">
        <div class="profile-header">
             <p><img src="#" alt="Profile Pic" class=" profile-photo rounded" width="150" height="150" /></p>
            <img src="https://via.placeholder.com/120" alt="Profile Photo" class="profile-photo">
            <div class="user-info">
               <p><strong>Name:</strong> {{ user.name }}</p>                
                <p>Software Developer</p>
            </div>
        </div>

        <div class="profile-details">
            <div class="detail-item">
                <h3>Email</h3>
                <p>{{ user.email }}</p>
            </div>

            <div class="detail-item">
                <h3>Contact Number</h3>
                <p> <strong>Name:</strong> {{ user.name }}</p>
            </div>

            <div class="detail-item">
                <h3>Business Name</h3>
                <p> {{ user.businessName }}.</p>
            </div>

            <div class="detail-item">
                <h3>Business Address</h3>
                <p> {{ user.businessAddress }}</p>
            </div>
        </div>
    </div>

    <div class="logout-section">
        <div class="logout-text">Need to log out?</div>
        <button class="logout-btn">LOGOUT</button>
    </div>
</div>
</div>
