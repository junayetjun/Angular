<form [formGroup]="growthForm" (ngSubmit)="addCompanyGrowth()" class="company-growth-form">
    <div class="form-header">
        <h2>Add Company Growth Data</h2>
    </div>

    <div class="form-group">
        <label for="name">Company Name</label>
        <input type="text" id="name" formControlName="name" class="form-control" placeholder="Enter company name">
        <div *ngIf="growthForm.get('name')?.invalid && growthForm.get('name')?.touched" class="error-message">
            Company name is required
        </div>
    </div>

    <div class="form-group">
        <label for="currentDividend">Current Dividend</label>
        <input type="number" id="currentDividend" formControlName="currentDividend" class="form-control"
            placeholder="Enter current dividend amount" step="0.01">
        <div *ngIf="growthForm.get('currentDividend')?.invalid && growthForm.get('currentDividend')?.touched"
            class="error-message">
            Valid dividend amount is required
        </div>
    </div>

    <div class="form-group">
        <label for="firstDividend">First Dividend</label>
        <input type="number" id="firstDividend" formControlName="firstDividend" class="form-control"
            placeholder="Enter first dividend amount" step="0.01">
        <div *ngIf="growthForm.get('firstDividend')?.invalid && growthForm.get('firstDividend')?.touched"
            class="error-message">
            Valid dividend amount is required
        </div>
    </div>

    <div class="form-group">
        <label for="discountRate">Discount Rate (%)</label>
        <input type="number" id="discountRate" formControlName="discountRate" class="form-control"
            placeholder="Enter discount rate" step="0.1">
        <div *ngIf="growthForm.get('discountRate')?.invalid && growthForm.get('discountRate')?.touched"
            class="error-message">
            Valid discount rate is required
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="growthForm.invalid">
            Add Company Growth
        </button>
        <button type="button" class="btn btn-secondary" (click)="growthForm.reset()">
            Reset
        </button>
    </div>
</form>
