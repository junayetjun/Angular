<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-gradient bg-success text-white text-center py-3 rounded-top">
                    <h4 class="mb-0">Edit Company Growth</h4>
                </div>
                <div class="card-body px-4 py-4">
                    <form [formGroup]="companyForm" (ngSubmit)="onSubmit()">

                        <!-- Company Name -->
                        <div class="mb-4">
                            <label for="name" class="form-label fw-semibold">Company Name</label>
                            <input type="text" class="form-control rounded-pill px-4" id="name" formControlName="name">
                            <div *ngIf="companyForm.get('name')?.invalid && companyForm.get('name')?.touched"
                                class="text-danger mt-1">
                                Company Name is required.
                            </div>
                        </div>

                        <!-- Current Dividend -->
                        <div class="mb-4">
                            <label for="currentDividend" class="form-label fw-semibold">Current Dividend</label>
                            <input type="text" class="form-control rounded-pill px-4" id="currentDividend"
                                formControlName="currentDividend">
                            <div *ngIf="companyForm.get('currentDividend')?.invalid && companyForm.get('currentDividend')?.touched"
                                class="text-danger mt-1">
                                Valid current dividend is required.
                            </div>
                        </div>

                        <!-- First Dividend -->
                        <div class="mb-4">
                            <label for="firstDividend" class="form-label fw-semibold">First Dividend Year</label>
                            <input type="text" class="form-control rounded-pill px-4" id="firstDividend"
                                formControlName="firstDividend">
                            <div *ngIf="companyForm.get('firstDividend')?.invalid && companyForm.get('firstDividend')?.touched"
                                class="text-danger mt-1">
                                Valid 4-digit year is required.
                            </div>
                        </div>

                        <!-- Discount Rate -->
                        <div class="mb-4">
                            <label for="discountRate" class="form-label fw-semibold">Discount Rate (%)</label>
                            <input type="text" class="form-control rounded-pill px-4" id="discountRate"
                                formControlName="discountRate">
                            <div *ngIf="companyForm.get('discountRate')?.invalid && companyForm.get('discountRate')?.touched"
                                class="text-danger mt-1">
                                Valid discount rate is required.
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill"
                                [disabled]="companyForm.invalid || isSubmitting">
                                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status"
                                    aria-hidden="true"></span>
                                {{ isSubmitting ? 'Updating...' : 'Update Company' }}
                            </button>
                        </div>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
