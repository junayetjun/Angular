<div class="root">
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0" style="text-align: center;">Company Growth Records</h3>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover table-striped" >
            <thead class="table-dark">
              <tr style="text-align: center;">
                <th>ID</th>
                <th>Company Name</th>
                <th>Current Dividend</th>
                <th>First Dividend</th>
                <th>Discount Rate</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let record of companyGrowthList">
                <td>{{ record.id }}</td>
                <td>{{ record.name }}</td>
                <td>{{ record.currentDividend }}%</td>
                <td>{{ record.firstDividend }}</td>
                <td>{{ record.discountRate }}%</td>
                <td>
                  <div class="btn-group">
                    <button 
                      class="btn btn-outline-primary btn-sm" 
                      (click)="getCompanyGrowthById(record.id)">
                      <i class="bi bi-pencil-square"></i> Edit
                    </button>
                    <button 
                      class="btn btn-outline-danger btn-sm" 
                      (click)="deleteCompanyGrowth(record.id)">
                      <i class="bi bi-trash"></i> Delete
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div *ngIf="companyGrowthList.length === 0" class="alert alert-info mt-3">
          <i class="bi bi-info-circle me-2"></i>
          No company growth records found.
        </div>
      </div>
    </div>
  </div>
</div>
