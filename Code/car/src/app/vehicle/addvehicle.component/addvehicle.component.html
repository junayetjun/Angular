<div class="root">

    <div class="container">
    <div class="form-card">
        <div class="form-header">
            <h2 ><i class="fas fa-car" ></i> Add Vehicle</h2>
        </div>
        <div class="form-body">
            <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="row g-3">
                <div class="col-md-6">
                    <div class="form-row">
                        <label for="name" class="form-label">Vehicle Name</label>
                        <input id="name" formControlName="vehicleName" class="form-control"
                            placeholder="Enter Vehicle Name" />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-row">
                        <label for="policeStations" class="form-label">Select Parts</label>
                        <select id="policeStations" formControlName="addParts" class="form-select" multiple size="5">
                            <option *ngFor="let ps of addParts" [value]="ps.id">
                                {{ ps.partsName }}
                            </option>
                        </select>
                        <small class="text-muted">Hold Ctrl (Windows) or Cmd (Mac) to select multiple.</small>
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="form-row">
                        <button type="submit" class="btn btn-primary" [disabled]="formGroup.invalid">
                            <i class="fas fa-plus-circle"></i> Add Vehicle
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
