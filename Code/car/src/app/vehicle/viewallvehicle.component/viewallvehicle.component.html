<div class="container mt-5">
    <h2 class="mb-4">All Vehicle</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Vehicle Name</th>
                <th>Parts Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let vehicle of vehicle">
                <td>{{ vehicle.id }}</td>
                <td>{{ vehicle.vehicleName }}</td>
                <td>{{ getPartsName(vehicle.addParts) }}</td>
                <td>
                    <!-- Add your Edit link/button if you have edit logic -->
                    <!-- <button class="btn btn-sm btn-warning me-2">Edit</button> -->
                    <button class="btn btn-sm btn-danger" (click)="deleteVehicle(vehicle.id!)">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
