<div class="root">

  <div class="colorful-form-container">
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="colorful-form">
      <div class="form-header">
        <h2>{{ editing ? 'Update Order' : 'Add New Order' }}</h2>
        <div class="form-decoration"></div>
      </div>

      <div class="form-row">
        <!-- Name Field -->
        <div class="form-group">
          <label for="name" class="form-label">Customer Name</label>
          <input id="name" formControlName="name" type="text" class="form-input" placeholder="Enter full name" required>
          <div class="input-icon">
            <i class="fas fa-user"></i>
          </div>
        </div>

        <!-- Contact Number Field -->
        <div class="form-group">
          <label for="contactNumber" class="form-label">Contact Number</label>
          <input id="contactNumber" formControlName="contactNumber" type="tel" class="form-input"
            placeholder="Enter phone number" required>
          <div class="input-icon">
            <i class="fas fa-phone"></i>
          </div>
        </div>
      </div>

      <!-- Vehicle Selection -->
      <div class="form-group">
        <label for="vehicle" class="form-label">Select Vehicle</label>
        <div class="select-wrapper">
          <select id="vehicle" formControlName="vehicle" class="form-select" (change)="onVehicleChange()" required>
            <option value="" disabled selected>Select Vehicle</option>
            <option *ngFor="let vehicle of allvehicles" [value]="vehicle.id">
              {{ vehicle.vehicleName }}
            </option>
          </select>
          <div class="select-icon">
            <i class="fas fa-car"></i>
          </div>
        </div>
      </div>

      <!-- Part Selection (Conditional) -->
      <div *ngIf="filteredAddParts.length > 0" class="form-group">
        <label for="addParts" class="form-label">Select Part</label>
        <div class="select-wrapper">
          <select id="addParts" formControlName="addParts" class="form-select" (change)="onPartChange()" required>
            <option value="" disabled selected>Select Part</option>
            <option *ngFor="let part of filteredAddParts" [value]="part.id">
              {{ part.partsName }}
            </option>
          </select>
          <div class="select-icon">
            <i class="fas fa-cogs"></i>
          </div>
        </div>
      </div>

      <!-- Part Price (Conditional) -->
      <div *ngIf="filteredAddParts.length > 0" class="form-group">
        <label for="partPrice" class="form-label">Part Price</label>
        <div class="price-input">
          <input id="partPrice" formControlName="partPrice" type="text" class="form-input" readonly
            placeholder="Price will appear here">
          <div class="input-icon">
            <i class="fas fa-tag"></i>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-footer">
        <button type="submit" class="btn-submit" [disabled]="formGroup.invalid">
          <span class="btn-text">
            <i class="fas fa-save me-2"></i>
            {{ editing ? 'Update Order' : 'Add Order' }}
          </span>
          <div class="btn-glow"></div>
        </button>
        <button type="reset" class="btn-submit" style="margin-left: 40px;">Reset</button>
      </div>
    </form>
  </div>
</div>
