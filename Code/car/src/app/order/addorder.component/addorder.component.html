
<div class="container mt-4">
  <h2 class="mb-4" style="text-align: center;">Add Order</h2>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input formControlName="name" class="form-control" placeholder="Full Name" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Contact Number</label>
      <input type="text" formControlName="contactNumber" class="form-control" placeholder="Contact Number" />
    </div>

    <div class="row">

    </div>


    <div *ngIf="allvehicles.length > 0" class="col-md-6">
  <select formControlName="vehicle" (change)="onVehicleChange()">
    <option value="">Select Vehicle</option>
    <option *ngFor="let vehicle of allvehicles" [value]="vehicle.id">{{ vehicle.vehicleName }}</option>
  </select>
</div>
<div *ngIf="filteredAddParts.length > 0" class="col-md-6">
  <select formControlName="addParts">
    <option value="">Select Part</option>
    <option *ngFor="let part of filteredAddParts" [value]="part.id">{{ part.partsName }}</option>
  </select>
</div>

    <div class="col-md-12">
      <button class="btn btn-success" type="submit" [disabled]="formGroup.invalid">
        Add Order
      </button>
    </div>
  </form>
</div>
