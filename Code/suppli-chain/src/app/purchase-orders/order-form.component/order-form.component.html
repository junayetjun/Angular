<!-- order-form.component.html -->
<div class="container mt-4">
    <h2>{{form.value.id ? 'Edit' : 'New'}} Purchase Order</h2>
    <form [formGroup]="form" (ngSubmit)="save()">
        <div class="row">
            <div class="col"><label>Order Number</label>
                <input class="form-control" formControlName="orderNumber">
            </div>
            <div class="col"><label>Supplier</label>
                <input class="form-control" formControlName="supplier">
            </div>
            <div class="col"><label>Date</label>
                <input type="date" class="form-control" formControlName="date">
            </div>
            <div class="col"><label>Status</label>
                <select class="form-control" formControlName="status">
                    <option *ngFor="let s of ['Draft','Sent','Received','Closed']">{{s}}</option>
                </select>
            </div>
        </div>
        <hr>
        <h4>Items</h4>
        <button type="button" class="btn btn-sm btn-success mb-2" (click)="addItem()">Add Item</button>
        <div formArrayName="items" *ngFor="let it of items.controls; let i=index" [formGroupName]="i">
            <div class="row g-2 align-items-end">
                <div class="col"><label>Product ID</label>
                    <input class="form-control" formControlName="productId" type="number">
                </div>
                <div class="col"><label>Name</label>
                    <input class="form-control" formControlName="productName">
                </div>
                <div class="col"><label>Qty</label>
                    <input class="form-control" formControlName="quantity" type="number">
                </div>
                <div class="col"><label>Unit Price</label>
                    <input class="form-control" formControlName="unitPrice" type="number" step="0.01">
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-danger" (click)="removeItem(i)">X</button>
                </div>
            </div>
        </div>
        <hr>
        <h5>Total: {{ total | currency }}</h5>
        <button type="submit" class="btn btn-primary me-2" [disabled]="form.invalid">Save</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </form>
</div>
