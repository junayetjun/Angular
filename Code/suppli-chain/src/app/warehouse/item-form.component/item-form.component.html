<!-- item-form.component.html -->
<div class="container mt-4">
  <h2>{{isNew ? 'Add New' : 'Edit'}} Item</h2>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="mb-3">
      <label>Name</label>
      <input class="form-control" formControlName="name">
    </div>
    <div class="mb-3">
      <label>SKU</label>
      <input class="form-control" formControlName="sku">
    </div>
    <div class="mb-3">
      <label>Quantity</label>
      <input type="number" class="form-control" formControlName="quantity">
    </div>
    <div class="mb-3">
      <label>Location</label>
      <input class="form-control" formControlName="location">
    </div>
    <button type="submit" class="btn btn-success me-2" [disabled]="form.invalid">Save</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </form>
</div>
