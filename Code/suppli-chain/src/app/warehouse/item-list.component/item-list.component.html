<!-- item-list.component.html -->
<div class="container mt-4">
  <h2>Warehouse Items</h2>
  <button class="btn btn-primary mb-3" (click)="addItem()">Add New Item</button>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th><th>SKU</th><th>Quantity</th><th>Location</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{item.name}}</td><td>{{item.sku}}</td><td>{{item.quantity}}</td><td>{{item.location}}</td>
        <td>
          <button class="btn btn-sm btn-info me-1" (click)="editItem(item.id!)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteItem(item.id!)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="loading">Loading...</div>
  <div *ngIf="!loading && items.length === 0">No items in warehouse.</div>
</div>
