<div class="container my-3">
    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Product Id</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Photo</th>
                    <th>Actions</th>

                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let r of retailers | async">
                    <td>{{r.id}}</td>
                    <td>{{r.name}}</td>
                    <td>{{r.description}}</td>
                    <td>{{r.photo}}</td>
                    <td>
                        <button class="btn btn-edit" (click)="getProductById(r.id)">Edit</button>
                        <button class="btn btn-delete" (click)="deleteProductById(r.id)">Delete</button>

                    </td>

                </tr>


            </tbody>
        </table>
    </div>
</div>
