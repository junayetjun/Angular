<div class="container my-3">
    <div class="bg-success text-center">
        <h1 class="jumborton">Add Order</h1>
    </div>
    <!--    start form-->
    <form [formGroup]="orderForm"  >
        <div class="row">
            <div class="col-md-6">
                <label for="exampleInputEmail1" class="form-label"> Product Name</label>
                <input type="text" class="form-control" id="name" formControlName="productName" placeholder="Full Name">
            </div>

            <div class="col-md-6">
                <label for="exampleInputEmail1" class="form-label">Shoulder</label>
                <input type="text" class="form-control" id="email" formControlName="shoulder" placeholder="example@gmail.com">
            </div>        
        </div>
        

        <div class="row">
            <div class="col-md-6">
                <label for="exampleInputEmail1" class="form-label">Size</label>
                <input type="text" class="form-control" id="contactNo" formControlName="size" placeholder="0000000">
            </div>
            <div class="col-md-6">
                <label for="exampleInputEmail1" class="form-label">Qunatity</label>
                <input type="text" class="form-control" id="contactNo" formControlName="quantity" placeholder="0000000">
            </div>
            <div class="col-md-6">
                <label for="exampleInputEmail1" class="form-label">Color</label>
                <input type="text" class="form-control" id="contactNo" formControlName="color" placeholder="0000000">
            </div>

        </div>

        <div class="row mt-3 text-center">
            <div class="col-md-6">
                <button type="submit" class="btn btn-success text-center"  (click)="addOrder()">Save</button>

            </div>

            <div class="col-md-6">
                <button type="reset" class="btn btn-danger text-center" >Reset</button>

            </div>
        </div>
    </form>

    <!--end form    -->
</div>
