<div class="container my-4">
  <form  (ngSubmit)="addProduct()">

    <!-- Product Type Dropdown -->
    <div class="mb-3">
      <label for="productType" class="form-label">Product Type:</label>
      <select class="form-select" id="productType" formControlName="productType">
        <option value="Shirt">Shirt</option>
        <option value="T-Shirt">T-Shirt</option>
      </select>
    </div>

    <!-- Shoulder Type Checkboxes -->
    <div class="mb-3">
      <label class="form-label d-block">Shoulder Type:</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="shoulderHalf" (change)="onCheckboxChange($event, 'shoulder')" value="half">
        <label class="form-check-label" for="shoulderHalf">Half Shoulder</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="shoulderFull" (change)="onCheckboxChange($event, 'shoulder')" value="full">
        <label class="form-check-label" for="shoulderFull">Full Shoulder</label>
      </div>
    </div>

    <!-- Quantity -->
    <div class="mb-3">
      <label for="quantity" class="form-label">Quantity:</label>
      <input type="number" class="form-control" id="quantity" formControlName="quantity">
    </div>

    <!-- Size Checkboxes -->
    <div class="mb-3">
      <label class="form-label d-block">Size:</label>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="sizeM" (change)="onCheckboxChange($event, 'size')" value="M">
        <label class="form-check-label" for="sizeM">M</label>
      </div>
      <div class="form-check mt-2">
        <input type="checkbox" class="form-check-input" id="sizeL" (change)="onCheckboxChange($event, 'size')" value="L">
        <label class="form-check-label" for="sizeL">L</label>
      </div>
      <div class="form-check mt-2">
        <input type="checkbox" class="form-check-input" id="sizeXL" (change)="onCheckboxChange($event, 'size')" value="XL">
        <label class="form-check-label" for="sizeXL">XL</label>
      </div>
    </div>

    <!-- Color Type Checkboxes -->
    <div class="mb-3">
      <label class="form-label d-block">Color Type:</label>
      <div class="form-check form-check-inline">
        <input type="checkbox" class="form-check-input" id="colorRed" (change)="onCheckboxChange($event, 'color')" value="red">
        <label class="form-check-label" for="colorRed">Red</label>
      </div>
      <div class="form-check form-check-inline">
        <input type="checkbox" class="form-check-input" id="colorGreen" (change)="onCheckboxChange($event, 'color')" value="green">
        <label class="form-check-label" for="colorGreen">Green</label>
      </div>
      <div class="form-check form-check-inline">
        <input type="checkbox" class="form-check-input" id="colorBlack" (change)="onCheckboxChange($event, 'color')" value="black">
        <label class="form-check-label" for="colorBlack">Black</label>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Submit</button>

  </form>
</div>
